<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Quick Connectors</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:system-ui,-apple-system,sans-serif;background:#f5f5f5}
.slide{display:none;width:100vw;height:100dvh;padding:5vmin;overflow-y:auto}
.slide.active{display:flex;flex-direction:column;justify-content:center}
h2{font-size:clamp(12px, 3vmin, 18px);color:#888;font-weight:500;margin-bottom:2vmin}
.q{font-size:clamp(18px, 5.5vmin, 32px);line-height:1.8;margin-bottom:3vmin}
.blank{display:inline-block;border-bottom:.3vmin dashed #333;min-width:20vmin;text-align:center;padding:0 1vmin;color:transparent;transition:color .2s}
.blank.revealed{color:#d32f2f;border-bottom-color:#d32f2f}
.btns{display:flex;gap:2vmin;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:2vmin 4vmin;font-size:clamp(14px, 4vmin, 22px);border:none;border-radius:1.5vmin;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn-reveal{background:#1976d2;color:#fff;flex:1;min-height:10vmin;font-weight:600}
.btn-reveal:hover{background:#1565c0}
.btn-nav{background:transparent;color:#1976d2;padding:2vmin 3vmin}
.btn-nav:disabled{color:#bbb}
.nav{margin-top:auto;display:flex;align-items:center;gap:1vmin;padding-top:3vmin}
.cnt{font-size:clamp(11px, 3vmin, 16px);color:#999;margin-left:auto}
</style>
</head>
<body>

<div class="slide active">
<h2>Q1/2</h2>
<div class="q">She speaks fluent English. <span class="blank" data-answer="In addition">____</span>, she is learning French.</div>
<div class="btns">
<button class="btn btn-reveal" onclick="reveal(0)">▶ Reveal Answer</button>
</div>
<div class="nav">
<button class="btn btn-nav" disabled>← Prev</button>
<button class="btn btn-nav" onclick="go(1)">Next →</button>
<span class="cnt">1/2</span>
</div>
</div>
<div class="slide">
<h2>Q2/2</h2>
<div class="q">The hotel was dirty. <span class="blank" data-answer="Furthermore">____</span>, the staff were rude.</div>
<div class="btns">
<button class="btn btn-reveal" onclick="reveal(1)">▶ Reveal Answer</button>
</div>
<div class="nav">
<button class="btn btn-nav" onclick="go(0)">← Prev</button>
<button class="btn btn-nav" disabled>Next →</button>
<span class="cnt">2/2</span>
</div>
</div>

<script>
const slides=document.querySelectorAll('.slide');
let current=0;
function go(n){slides[current].classList.remove('active');current=n;slides[current].classList.add('active')}
function reveal(n){slides[n].querySelectorAll('.blank').forEach(el=>{el.textContent=el.dataset.answer;el.classList.add('revealed')})}
</script>
</body>
</html>
